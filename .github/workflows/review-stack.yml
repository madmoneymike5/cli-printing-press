name: Review Stack
# review-stack-control: current PR gate scans files only; TruffleHog owns history

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-stack:
    uses: madmoneymike5/review-stack-control/.github/workflows/review-stack.yml@v1
    with:
      native-command: >-
        go vet ./... && go test ./...
      central-ref: v1
