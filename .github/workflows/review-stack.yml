name: Review Stack
# review-stack-control: runtime mirror rollout verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-stack:
    uses: madmoneymike5/review-stack-runtime/.github/workflows/review-stack.yml@e32b9fa29dbcf65a289c3fd066d42cd7cb2f094f
    with:
      native-command: >-
        export GOFLAGS="${GOFLAGS:+$GOFLAGS }-buildvcs=false"; go vet ./...
      opengrep-excludes: ""
      gitleaks-excludes: |-
        
